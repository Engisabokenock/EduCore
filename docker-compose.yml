version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/educore
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=prod_fallback_secret_signing_key_string_09871234
      - JWT_SECRET_KEY=prod_fallback_secret_signing_key_string_09871234
      - JWT_REFRESH_SECRET=prod_fallback_refresh_signing_key_string_56784321
      - CLOUDFLARE_ENDPOINT=https://cloudfarestorage.com
      - CLOUDFLARE_ACCESS_KEY=mock_key
      - CLOUDFLARE_SECRET_KEY=mock_secret
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=educore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
