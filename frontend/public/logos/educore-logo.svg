<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 82" fill="none" role="img" aria-label="EduCore — CBC Learning Made Simple">
  <title>EduCore</title>

  <!-- Book left wing -->
  <path d="M40,72 C15,70 -2,45 8,18 C18,34 30,48 38,55 Z" fill="#16A34A"/>
  <!-- Book right wing -->
  <path d="M40,72 C65,70 82,45 72,18 C62,34 50,48 42,55 Z" fill="#16A34A"/>
  <!-- Book spine -->
  <ellipse cx="40" cy="72" rx="4.5" ry="2.5" fill="#15803D"/>

  <!-- Blue ring clipped above book area -->
  <defs>
    <clipPath id="r">
      <rect x="5" y="0" width="70" height="60"/>
    </clipPath>
  </defs>
  <circle cx="40" cy="40" r="26" fill="none" stroke="#1E40AF" stroke-width="7" clip-path="url(#r)"/>

  <!-- Graduation cap board -->
  <rect x="13" y="5" width="54" height="8" rx="2.5" fill="#1E40AF"/>
  <!-- Cap top stud -->
  <circle cx="40" cy="5" r="4" fill="#0F172A"/>
  <!-- Tassel rope + ball -->
  <line x1="67" y1="9" x2="69" y2="21" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="69" cy="25" r="3.5" fill="#F97316"/>

  <!-- "E" inside ring -->
  <rect x="26" y="27" width="5.5" height="24" rx="1.5" fill="#1E40AF"/>
  <rect x="26" y="27" width="21" height="6"   rx="1.5" fill="#1E40AF"/>
  <rect x="26" y="36" width="16" height="5"   rx="1.5" fill="#F97316"/>
  <rect x="26" y="45" width="21" height="6"   rx="1.5" fill="#1E40AF"/>

  <!-- Wordmark -->
  <text x="92" y="50"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-weight="900" font-size="32" letter-spacing="-0.5">
    <tspan fill="#1E40AF">Edu</tspan><tspan fill="#16A34A">Core</tspan>
  </text>
  <!-- Tagline -->
  <text x="93" y="66"
        font-family="Arial,Helvetica,sans-serif"
        font-weight="600" font-size="9.5" letter-spacing="2.2" fill="#6B7280">CBC LEARNING MADE SIMPLE</text>
</svg>
