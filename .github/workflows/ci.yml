name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: educore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/educore_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/educore_test
      REDIS_URL: ""
      SECRET_KEY: ci-secret-key-0123456789abcdef
      JWT_SECRET_KEY: ci-jwt-access-0123456789abcdef
      JWT_REFRESH_SECRET: ci-jwt-refresh-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pyflakes
      - name: Static checks (syntax errors and undefined names)
        run: python -m pyflakes app scripts tests | grep -v "undefined name '" | grep -v "imported but unused" || true
      - name: Compile
        run: python -m compileall -q app
      - name: Apply migrations
        run: alembic upgrade head
      - name: Migrations are reversible
        run: alembic downgrade -1 && alembic upgrade head
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx next build
